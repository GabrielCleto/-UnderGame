<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Underground Game - Monster Battle Preview</title>
  <style>
    body {
      background: #0d0a14;
      color: #eee;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border: 3px solid #8b6b23;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      image-rendering: pixelated;
    }
    h2 {
      color: #ffd700;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Novos Monstros & Chefões Pixel Art V2 em Ação</h2>
  <canvas id="cv" width="960" height="540"></canvas>
  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    const images = {
      chaos_imp: new Image(),
      void_spider: new Image(),
      boss_void_overlord: new Image(),
      boss_magma_colossus: new Image()
    };
    images.chaos_imp.src = '../assets/new_monsters/chaos_imp.png';
    images.void_spider.src = '../assets/new_monsters/void_spider.png';
    images.boss_void_overlord.src = '../assets/new_monsters/boss_void_overlord.png';
    images.boss_magma_colossus.src = '../assets/new_monsters/boss_magma_colossus.png';

    const specs = {
      chaos_imp: { fw: 32, fh: 32, scale: 2.2, name: 'Imp do Caos (Voador)' },
      void_spider: { fw: 40, fh: 32, scale: 2.2, name: 'Aranha do Vazio (Rápido)' },
      boss_void_overlord: { fw: 64, fh: 64, scale: 2.5, name: 'Soberano do Vazio (Chefe)' },
      boss_magma_colossus: { fw: 64, fh: 64, scale: 2.5, name: 'Colosso de Magma (Chefe)' }
    };

    let t = 0;
    function render() {
      t += 0.035;
      // Background dungeon floor
      ctx.fillStyle = '#14111d';
      ctx.fillRect(0, 0, cv.width, cv.height);

      // Floor tiles
      ctx.strokeStyle = '#1d192a';
      ctx.lineWidth = 1;
      for (let x = 0; x < cv.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke();
      }
      for (let y = 0; y < cv.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke();
      }

      // 4 Pedestals / Positions
      const monsters = [
        { type: 'chaos_imp', x: 130, y: 280, isAtk: Math.floor(t * 1.5) % 4 === 3 },
        { type: 'void_spider', x: 360, y: 300, isAtk: Math.floor(t * 1.2) % 4 === 3 },
        { type: 'boss_void_overlord', x: 620, y: 280, isAtk: Math.floor(t * 0.9) % 5 === 4 },
        { type: 'boss_magma_colossus', x: 840, y: 300, isAtk: Math.floor(t * 0.8) % 5 === 4 }
      ];

      monsters.forEach(m => {
        const d = specs[m.type];
        const img = images[m.type];
        if (!img.complete) return;

        // Shadow
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath();
        ctx.ellipse(m.x, m.y, d.fw * d.scale * 0.45, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Frame
        const animFrames = m.isAtk ? [4, 5] : [0, 1, 2, 3];
        const fps = m.isAtk ? 6 : (m.type === 'chaos_imp' ? 10 : 5);
        const col = animFrames[Math.floor(t * fps) % animFrames.length];

        const w = d.fw * d.scale;
        const h = d.fh * d.scale;
        const dx = m.x - w / 2;
        const dy = m.y - h;

        ctx.drawImage(img, col * d.fw, 0, d.fw, d.fh, Math.round(dx), Math.round(dy), w, h);

        // Name Tag
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(d.name, m.x, m.y + 35);
        
        ctx.fillStyle = m.isAtk ? '#ff5533' : '#a090c0';
        ctx.font = '10px monospace';
        ctx.fillText(m.isAtk ? '⚔ ATACANDO / CAST' : '• MOVIMENTO / IDLE', m.x, m.y + 50);
      });

      requestAnimationFrame(render);
    }

    // Wait for images
    let loaded = 0;
    Object.values(images).forEach(im => {
      im.onload = () => {
        loaded++;
        if (loaded >= 4) render();
      };
    });
  </script>
</body>
</html>
